<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#33bdea" />
  <title>Idle Island Planning</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="game" aria-label="Idle Island Planning 게임">
    <canvas id="world" width="1280" height="720" aria-label="섬 지도"></canvas>

    <header class="hud top-hud">
      <button class="round-button" id="settingsButton" aria-label="설정">☰</button>
      <div class="level-pill">
        <span class="level-ring"><b id="playerLevel">1</b></span>
        <div><small>ISLAND LEVEL</small><strong id="xpText">0 / 100 XP</strong></div>
      </div>
      <div class="resources">
        <div class="resource"><span class="coin icon">●</span><b id="coins">250</b></div>
        <div class="resource"><span class="wood icon">▰</span><b id="wood">0</b></div>
        <div class="resource"><span class="banana icon">◒</span><b id="bananas">0</b></div>
      </div>
    </header>

    <aside class="quest-card" id="questCard">
      <span class="quest-icon">★</span>
      <div><small>CURRENT MISSION</small><strong id="questText">바나나 농장 건설</strong><div class="quest-progress"><i id="questBar"></i></div></div>
      <b id="questReward">+120</b>
    </aside>

    <div id="incomeLayer" aria-hidden="true"></div>

    <section class="facility-panel hidden" id="facilityPanel" aria-live="polite">
      <button class="facility-close" id="closeFacility" aria-label="닫기">×</button>
      <div class="facility-title"><span class="facility-icon" id="facilityIcon">🪵</span><div><small id="facilityLevel">LV.1</small><h2 id="facilityName">목재</h2></div></div>
      <div class="stars" id="facilityStars">☆ ☆ ☆ ☆ ☆</div>
      <div class="production-row"><span><b>●</b> <strong id="facilityIncome">20</strong></span><span>◷ <strong id="facilityTime">15초</strong></span><button id="facilityUpgrade">● 280</button></div>
      <div class="panel-divider"></div>
      <div class="truck-row"><span class="truck-icon">▰</span><b>트럭</b><strong id="truckCount">1/3</strong><button id="truckUpgrade">● 3.84K</button></div>
      <div class="panel-divider"></div>
      <div class="perfect-row"><strong>완벽!</strong><span>완벽 배송 확률 <b id="perfectChance">5%</b></span></div>
    </section>

    <button class="speed-boost" id="speedBoost">
      <span class="boost-meter"><i></i><b>💨</b></span>
      <strong id="boostTime">04:00</strong><small>속도 증가</small>
    </button>

    <nav class="bottom-dock" aria-label="건설 메뉴">
      <button class="dock-action active" data-panel="build"><span>⌂</span><b>BUILD</b></button>
      <button class="dock-action" data-panel="trade"><span>⚓</span><b>TRADE</b></button>
      <button class="main-build" id="mainBuildButton"><span>＋</span><b>BUILD</b></button>
      <button class="dock-action" data-panel="research"><span>⚙</span><b>UPGRADE</b></button>
      <button class="dock-action" data-panel="map"><span>✈</span><b>ISLANDS</b></button>
    </nav>

    <section class="sheet hidden" id="sheet" aria-live="polite">
      <div class="sheet-handle"></div>
      <div class="sheet-head"><div><small id="sheetEyebrow">ISLAND DEVELOPMENT</small><h2 id="sheetTitle">Build</h2></div><button id="closeSheet" aria-label="닫기">×</button></div>
      <div class="sheet-content" id="sheetContent"></div>
    </section>

    <section class="welcome" id="welcome">
      <div class="logo-mark"><span>☀</span><b>IDLE ISLAND</b><strong>PLANNING</strong></div>
      <p>작은 섬을 거대한 무역 도시로 키워 보세요.</p>
      <button id="startButton">START BUILDING</button>
    </section>

    <div class="toast" id="toast"></div>
  </main>
  <script src="game.js"></script>
</body>
</html>
